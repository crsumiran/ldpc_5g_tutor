<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 504" class="bn" role="img" aria-label="Control generator of an 8-lane Banyan for shift 5: per stage one shift bit a, the low bits b, a thermometer decoder and an XOR per switch position">
<style>
.bn .bn-bg { fill: var(--surface, #ffffff); }
.bn text { font-family: var(--font-mono, ui-monospace, Menlo, Consolas, monospace); fill: var(--ink, #15211d); }
.bn .bn-wire { fill: none; stroke: var(--muted, #56645f); stroke-width: 1.4; }
.bn .bn-box { fill: var(--surface, #ffffff); stroke: var(--ink, #15211d); stroke-width: 1.4; }
.bn .bn-box.bn-opq { stroke-dasharray: 7 5; stroke: var(--muted, #56645f); }
.bn .bn-box.x { fill: var(--accent-soft, #e1eee9); stroke: var(--hi, #b86e00); stroke-width: 2.2; }
.bn .bn-in { fill: none; stroke: var(--ink, #15211d); stroke-width: 1.6; }
.bn .bn-in.x { stroke: var(--hi, #b86e00); stroke-width: 2.2; }
.bn .bn-pill { fill: var(--surface, #ffffff); stroke: var(--accent, #0b6b57); stroke-width: 1.6; }
.bn .bn-val { font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.bn .bn-lane { font-size: 12px; fill: var(--muted, #56645f); dominant-baseline: central; }
.bn .bn-head { font-size: 13px; font-weight: 600; text-anchor: middle; }
.bn .bn-sub { font-size: 11.5px; fill: var(--muted, #56645f); text-anchor: middle; }
.bn .bn-sw { font-size: 10.5px; fill: var(--muted, #56645f); text-anchor: middle; }
.bn .bn-key { font-size: 11.5px; fill: var(--muted, #56645f); }
.bn .bn-grp { fill: var(--accent-soft, #e1eee9); fill-opacity: 0.7; stroke: none; }
.bn .bn-grp-t { font-size: 11.5px; fill: var(--accent, #0b6b57); font-weight: 600; }
</style>
<style>
.bn .bn-mux { fill: var(--surface, #ffffff); stroke: var(--ink, #15211d); stroke-width: 1.4; }
.bn .bn-mux.x { fill: var(--accent-soft, #e1eee9); stroke: var(--hi, #b86e00); stroke-width: 2; }
.bn .bn-sel { font-size: 10.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.bn .bn-on { fill: none; stroke: var(--accent, #0b6b57); stroke-width: 2.2; }
.bn .bn-off { fill: none; stroke: var(--muted, #56645f); stroke-width: 1.1; opacity: 0.35; }
.bn .bn-dash { stroke-dasharray: 6 4; }
.bn .bn-pill.z { stroke: var(--rule, #d3dcd8); }
.bn .bn-val.z { fill: var(--muted, #56645f); font-weight: 400; }
.bn .bn-zero { font-size: 10.5px; fill: var(--muted, #56645f); text-anchor: end; dominant-baseline: central; }
.bn .bn-panel { font-size: 12.5px; font-weight: 600; fill: var(--accent, #0b6b57); }
</style>
<rect class="bn-bg" x="0" y="0" width="970" height="504" rx="8"/>
<style>
.bn .bn-cell { fill: var(--surface, #ffffff); stroke: var(--rule, #d3dcd8); stroke-width: 1.2; }
.bn .bn-cell.a { stroke: var(--hi, #b86e00); stroke-width: 2.2; }
.bn .bn-cell.b { fill: var(--accent-soft, #e1eee9); stroke: var(--accent, #0b6b57); stroke-width: 1.6; }
.bn .bn-cv { font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.bn .bn-cv.z { fill: var(--muted, #56645f); font-weight: 400; }
.bn .bn-ctl { fill: none; stroke: var(--muted, #56645f); stroke-width: 1.4; }
.bn .bn-ctl.a { stroke: var(--hi, #b86e00); stroke-width: 1.8; }
.bn .bn-dot { fill: var(--hi, #b86e00); }
.bn .bn-drv { font-size: 11.5px; text-anchor: middle; fill: var(--muted, #56645f); }
.bn .bn-drv.x { fill: var(--hi, #b86e00); font-weight: 700; }
.bn .bn-row { font-size: 11.5px; fill: var(--muted, #56645f); dominant-baseline: central; }
</style>
<text class="bn-row" x="14" y="104">shift</text>
<text class="bn-row" x="14" y="170">thermometer</text>
<text class="bn-row" x="14" y="222">t[k] = k &lt; b</text>
